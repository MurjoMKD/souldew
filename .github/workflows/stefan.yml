name: Stefan Mario SoulLink – Windows-Installer

# Baut den Windows-Installer von "Stefan Mario SoulLink" (basiert auf souldew, GPL-3.0).
# Starten: Actions › "Stefan Mario SoulLink – Windows-Installer" › Run workflow. Ergebnis unter "Artifacts".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctr:
    uses: ./.github/workflows/ctr.yml
    with:
      platforms: windows

  native:
    uses: ./.github/workflows/native.yml
    with:
      platforms: windows

  build:
    name: Installer bauen
    needs: [ctr, native]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Stefans Änderungen einspielen (stefan.patch)
        run: git apply --whitespace=nowarn stefan.patch
      - run: npm ci
      - run: node scripts/fetch-jre.mjs x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ctr-win32-x64
          path: tools/ctr/win32-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-win32-x64
          path: tools/native/win32-x64
      - name: Installer bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StefanMarioSoulLink-Installer
          path: dist/StefanMarioSoulLink-*-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 30
